<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>CMC Global CMS — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#03091a;}
*{box-sizing:border-box;}
a{color:#8fd0ff;text-decoration:none;}
a:hover{color:#ffffff;}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes dotpulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;background:#03091a;font-family:Montserrat, Arial, Helvetica, sans-serif;color:#dce7f5;overflow:hidden;display:flex;flex-direction:column;">
  <div ref="{{ bgRef }}" style="position:absolute;inset:0;z-index:0;background:linear-gradient(180deg, #03091a, #04102a, #061634);"></div>
  <div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 50%, rgba(3,9,26,.55), rgba(3,9,26,0) 70%);"></div>

  <header style="position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px clamp(20px,4vw,48px);">
    <img src="website/public/images/logo.svg" alt="CMC Global" style="height:28px;width:auto;filter:brightness(0) invert(1);">
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.12em;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.28);color:#c9d9ee;">CMS ADMIN</span>
      <a href="#" style="font-size:14px;font-weight:500;color:#c9d9ee;">cmcglobal.com ↗</a>
    </div>
  </header>

  <main style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 56px;">
    <div style="width:100%;max-width:440px;animation:rise 420ms cubic-bezier(.22,1,.36,1) both;">
      <div style="text-align:center;margin-bottom:22px;">
        <div style="margin:0 auto 16px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 34% 30%, #eaf6ff 0%, #7cc4f7 42%, #1a6fc4 78%, #0c3f7d 100%);box-shadow:0 0 22px rgba(90,180,255,.55);"></div>
        <h1 style="margin:0;font-size:clamp(22px,2.6vw,28px);font-weight:700;color:#ffffff;letter-spacing:-.01em;">CMC Global <span style="color:#43a4ff;">CMS</span></h1>
        <p style="margin:8px 0 0;font-size:13.5px;color:#c9d9ee;">Sign in to manage site content</p>
      </div>

      <div style="border-radius:10px;border:1px solid rgba(255,255,255,.26);padding:26px;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);background:linear-gradient(105deg, rgba(214,228,245,.2), rgba(150,180,215,.1));box-shadow:0 18px 44px rgba(3,12,32,.34);display:flex;flex-direction:column;gap:18px;">
        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:flex-start;gap:12px;border-radius:8px;padding:11px 12px 11px 14px;font-size:13px;line-height:1.5;background:rgba(255,110,110,.16);border:1px solid rgba(255,140,140,.45);color:#ffe1e1;">
            <div style="flex:1;"><strong style="color:#ffffff;">Authentication error</strong><br>{{ errorText }}</div>
            <button onClick="{{ dismiss }}" aria-label="Dismiss" style="flex:none;width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#ffffff;font-size:14px;line-height:1;cursor:pointer;">×</button>
          </div>
        </sc-if>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <span style="font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c9d9ee;">What you can manage</span>
          <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);">
              <span style="font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.06em;color:#43a4ff;width:18px;">{{ p.n }}</span>
              <span style="font-size:14px;color:#ffffff;">{{ p.t }}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ login }}" style="margin-top:4px;display:flex;align-items:center;justify-content:space-between;border:none;border-radius:999px;background:#ffffff;padding:6px;font-family:inherit;font-size:14px;font-weight:600;color:#0d2b52;cursor:pointer;" style-hover="background:#e8f1fb;">
            <span style="padding-left:22px;">Sign in with CMC SSO</span>
            <span style="display:flex;width:36px;height:36px;border-radius:50%;background:#0b63c5;color:#ffffff;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          </button>
        </sc-if>
        <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:4px;height:48px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);font-size:14px;color:#dce7f5;">
            <span style="display:flex;gap:6px;">
              <span style="width:6px;height:6px;border-radius:50%;background:#ffffff;animation:dotpulse 1.2s ease-in-out infinite;"></span>
              <span style="width:6px;height:6px;border-radius:50%;background:#ffffff;animation:dotpulse 1.2s ease-in-out .16s infinite;"></span>
              <span style="width:6px;height:6px;border-radius:50%;background:#ffffff;animation:dotpulse 1.2s ease-in-out .32s infinite;"></span>
            </span>Redirecting to CMC sign-in…
          </div>
        </sc-if>
      </div>
      <p style="margin:18px 0 0;text-align:center;font-family:'JetBrains Mono', monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,217,238,.75);">You'll continue on auth.cmcglobal.com · OAuth2 PKCE</p>
    </div>
  </main>

  <footer style="position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px clamp(20px,4vw,48px);background:rgba(4,11,26,.92);backdrop-filter:blur(12px);box-shadow:0 -2px 16px rgba(2,7,20,.35);font-size:13px;color:#c9d9ee;">
    <span>© 2026 CMC Global</span>
    <nav style="display:flex;gap:20px;">
      <a href="#" style="color:#c9d9ee;">Privacy</a>
      <a href="#" style="color:#c9d9ee;">Help</a>
    </nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;authError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lattice&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  bgRef = React.createRef();
  state = { busy: false, dismissed: false };
  componentDidMount() {
    let tries = 0;
    const init = () => {
      if (window.VANTA && window.THREE && this.bgRef.current && this.props.lattice !== false) {
        this.fx = window.VANTA.NET({ el: this.bgRef.current, THREE: window.THREE, mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 0.7, color: 0x2f86cf, backgroundColor: 0x03091a, points: 11, maxDistance: 23, spacing: 16, showDots: true });
      } else if (tries++ < 40) this.poll = setTimeout(init, 150);
    };
    init();
  }
  componentWillUnmount() { clearTimeout(this.poll); clearTimeout(this.nav); this.fx && this.fx.destroy(); }
  componentDidUpdate(pp) { if (pp.authError !== this.props.authError) this.setState({ dismissed: false }); }
  renderVals() {
    const err = this.props.authError ?? false;
    return {
      bgRef: this.bgRef,
      showError: err && !this.state.dismissed,
      errorText: 'The sign-in callback was rejected (state mismatch). Please try again.',
      dismiss: () => this.setState({ dismissed: true }),
      perks: [{ n: '01', t: 'Homepage content for your regions' }, { n: '02', t: 'Images and videos' }, { n: '03', t: 'The public assistant’s knowledge' }],
      idle: !this.state.busy, busy: this.state.busy,
      login: () => { this.setState({ busy: true }); this.nav = setTimeout(() => { window.location.href = 'CMS Sign In.dc.html'; }, 1100); }
    };
  }
}
</script>
</body>
</html>
