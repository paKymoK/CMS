services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-platform

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    ports:
      - "6379:6379"
    networks:
      - cms-platform

  minio:
    image: minio/minio:latest
    container_name: cms-minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - cms-platform

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cms-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - cms-platform

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    image: cms-platform/auth-service
    container_name: cms-auth-service
    ports:
      - "9000:9000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: authentication
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LDAP_URL: ldap://host.docker.internal:389
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    networks:
      - cms-platform

  media-service:
    build:
      context: ../backend
      dockerfile: media-service/Dockerfile
    image: cms-platform/media-service
    container_name: cms-media-service
    ports:
      - "8082:8082"
    environment:
      AUTH_ISSUER_URI: http://auth-service:9000
      JWK_URI: http://auth-service:9000/oauth2/jwks
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: media
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - auth-service
    networks:
      - cms-platform

  chat-service:
    build:
      context: ../backend
      dockerfile: chat-service/Dockerfile
    image: cms-platform/chat-service
    container_name: cms-chat-service
    ports:
      - "8083:8083"
    environment:
      AUTH_ISSUER_URI: http://auth-service:9000
      JWK_URI: http://auth-service:9000/oauth2/jwks
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: chat
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CONTENT_SERVICE_BASE_URL: http://content-service:8084
    depends_on:
      - postgres
      - auth-service
      - qdrant
      - content-service
    networks:
      - cms-platform

  content-service:
    build:
      context: ../backend
      dockerfile: content-service/Dockerfile
    image: cms-platform/content-service
    container_name: cms-content-service
    ports:
      - "8084:8084"
    environment:
      AUTH_ISSUER_URI: http://auth-service:9000
      JWK_URI: http://auth-service:9000/oauth2/jwks
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: content
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
      - auth-service
    networks:
      - cms-platform

networks:
  cms-platform:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  qdrant-data:
