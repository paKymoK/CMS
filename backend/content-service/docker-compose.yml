services:
  content-service:
    build:
      context: ..
      dockerfile: content-service/Dockerfile
    image: takypok/content-service
    container_name: content-service
    # Host networking: 127.0.0.1 is this machine, so the defaults below work on a single
    # Linux host; on separate VPSs override the *_HOST/*_URI values (and
    # EUREKA_INSTANCE_IP_ADDRESS) in .env with the real private IPs. Linux only.
    network_mode: host
    labels:
      # Alloy skips docker-log collection for this container; it reads the log file instead
      logging.source: file
    environment:
      LOG_DIR: /logs
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://127.0.0.1:9000}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: content
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_INSTANCE_IP_ADDRESS: ${EUREKA_INSTANCE_IP_ADDRESS:-127.0.0.1}
      EUREKA_URI: ${EUREKA_URI:-http://127.0.0.1:8761/eureka}
      JWK_URI: ${JWK_URI:-http://127.0.0.1:9000/oauth2/jwks}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://127.0.0.1:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-http://127.0.0.1:4318/v1/metrics}
    volumes:
      # Host dir the Alloy reads from (default: backend/logs); must match alloy's LOG_HOST_DIR
      - ${LOG_HOST_DIR:-../logs}:/logs
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
