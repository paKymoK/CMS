server:
  port: 8084

spring:
  main:
    web-application-type: reactive
  application:
    name: content-service
  config:
    import:
      - 'classpath:config/liquibase.yml'
      - 'classpath:config/r2dbc.yml'
      - 'classpath:config/oauth2.yml'
      - 'classpath:config/springdoc.yml'
      - 'classpath:management.yml'

# The 5 site subdomains (public GET /v1/home) + admin-app's own origin — see core-v1's
# SecurityConfig. Comma-separated; user-maintained per the decision log, never a wildcard.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    io.r2dbc.postgresql.QUERY: INFO
    io.r2dbc.postgresql.PARAM: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: DEBUG
