services:
  chat-service:
    build:
      context: ..
      dockerfile: chat-service/Dockerfile
    image: takypok/chat-service
    container_name: chat-service
    ports:
      - "8083:8083"
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://auth-service:9000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: chat
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka}
      JWK_URI: ${JWK_URI:-http://auth-service:9000/oauth2/jwks}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://alloy:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-http://alloy:4318/v1/metrics}
      # Qdrant/Ollama aren't part of this compose stack yet; defaults below only work if
      # they're reachable at localhost from inside the container (e.g. host networking).
      # Override with real hosts/URLs once those services are deployed.
      QDRANT_HOST: ${QDRANT_HOST:-localhost}
      QDRANT_PORT: ${QDRANT_PORT:-6334}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
    # discovery-service isn't defined in this file — this depends_on only resolves when
    # this file is passed to compose alongside discovery-service's own, e.g.:
    #   docker compose -f ../discovery-service/docker-compose.yml -f docker-compose.yml up -d
    # Running `docker compose up` from this directory alone fails validation.
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - takypok_default
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  takypok_default:
    external: true
