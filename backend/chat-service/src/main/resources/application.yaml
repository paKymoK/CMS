server:
  port: 8083

spring:
  application:
    name: chat-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  config:
    import:
      - 'classpath:config/liquibase.yml'
      - 'classpath:config/r2dbc.yml'
      - 'classpath:config/oauth2.yml'
      - 'classpath:config/kafka.yml'
      - 'classpath:management.yml'
  autoconfigure:
    # VectorStoreConfig replaces this with one QdrantVectorStore PER SITE instead of the single
    # shared collection this autoconfiguration would otherwise create from the properties below.
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  ai:
    ollama:
      # Chat model config below is now used ONLY by the pre-existing employee-facing CRM
      # assistant (AssistantService) and CodeReviewService — untouched, kept exactly as forked.
      # The public CMS assistant (PublicAssistantService) uses spring.ai.anthropic below instead.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3.5:4b
        options:
          temperature: 0.1
          num-ctx: 32768
      embedding:
        # Still Ollama — Anthropic has no embeddings API, and there's no reason to touch this
        # half. Both the CRM assistant's and the CMS assistant's vector stores embed with this.
        model: bge-m3
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
          temperature: 0.3
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        # Only read by VectorStoreConfig's own legacy "vectorStore" bean now (the
        # single-collection autoconfiguration that used to own this property is excluded above) —
        # keeps the pre-existing CRM assistant (AssistantService/IngestionService) working
        # unmodified against its original collection, alongside the new per-site collections.
        collection-name: crm_vi

content-service:
  base-url: ${CONTENT_SERVICE_BASE_URL:http://localhost:8084}

# See content-service's application.yaml for the full rationale — same shared core-v1 CORS bean.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

ai:
  rag:
    enabled: true

gitlab:
  base-url: ${GITLAB_BASE_URL:}
  token: ${GITLAB_TOKEN:}

github:
  base-url: ${GITHUB_BASE_URL:https://github.com}
  token: ${GITHUB_TOKEN:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://127.0.0.1:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.ai: DEBUG