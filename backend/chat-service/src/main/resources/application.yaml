server:
  port: 8083

spring:
  application:
    name: chat-service
  main:
    web-application-type: reactive
  http:
    client:
      # OllamaApiAutoConfiguration resolves any RestClient.Builder bean already in the context
      # (see OllamaApiAutoConfiguration#ollamaApi), so this flows straight through to Ollama's
      # blocking chat calls — a local model can take far longer than a hosted one to respond, so
      # the default read timeout (10s) isn't enough. Also applies to Anthropic's blocking client
      # for the same reason (same RestClient.Builder bean); harmless there since it only matters
      # if a call actually hangs that long.
      read-timeout: ${AI_HTTP_READ_TIMEOUT:10m}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  config:
    import:
      - 'classpath:config/liquibase.yml'
      - 'classpath:config/r2dbc.yml'
      - 'classpath:config/oauth2.yml'
      - 'classpath:management.yml'
  autoconfigure:
    # VectorStoreConfig replaces this with one QdrantVectorStore PER SITE instead of the single
    # shared collection this autoconfiguration would otherwise create from the properties below.
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
  ai:
    ollama:
      # Anthropic has no embeddings API, so embedding stays on Ollama regardless of
      # ai.chat.provider below — every per-site vector store always embeds with this.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # Only used when ai.chat.provider=ollama (see AiConfig) — local testing, no
        # ANTHROPIC_API_KEY needed. Pull this model in your local Ollama first.
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
        options:
          temperature: 0.3
      embedding:
        model: bge-m3
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
          temperature: 0.3
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}

content-service:
  base-url: ${CONTENT_SERVICE_BASE_URL:http://localhost:8084}

# See content-service's application.yaml for the full rationale — same shared core-v1 CORS bean.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

ai:
  rag:
    enabled: true
  chat:
    # anthropic (default, production) or ollama (local testing against a model you're running
    # yourself — see AiConfig).
    provider: ${AI_CHAT_PROVIDER:anthropic}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://127.0.0.1:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.ai: DEBUG