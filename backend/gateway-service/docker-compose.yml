services:
  gateway-service:
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    image: takypok/gateway-service
    container_name: gateway-service
    labels:
      # Alloy skips docker-log collection for this container; it reads the log file instead
      logging.source: file
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      LOG_DIR: /logs
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://auth-service:9000}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      GATEWAY_IO_WORKER_COUNT: ${GATEWAY_IO_WORKER_COUNT:-}
      SINGLE_TAB_REDIS_ON_FAILURE: ${SINGLE_TAB_REDIS_ON_FAILURE:-FAIL_OPEN}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-http://alloy:4318/v1/metrics}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://alloy:4318/v1/traces}
    # discovery-service isn't defined in this file — this depends_on only resolves when
    # this file is passed to compose alongside discovery-service's own, e.g.:
    #   docker compose -f ../discovery-service/docker-compose.yml -f docker-compose.yml up -d
    # Running `docker compose up` from this directory alone fails validation.
    depends_on:
      discovery-service:
        condition: service_healthy
    volumes:
      # Host dir the Alloy reads from (default: backend/logs); must match alloy's LOG_HOST_DIR
      - ${LOG_HOST_DIR:-../logs}:/logs
    networks:
      - takypok_default
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  takypok_default:
    external: true
