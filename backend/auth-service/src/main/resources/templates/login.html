<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/ams.svg" />
    <title>CMC Global CMS — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #189fe0;
            --brand-accent: #00bbe4;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #03091a; }
        body {
            font-family: 'Montserrat', Arial, Helvetica, sans-serif;
            color: #dce7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            background: linear-gradient(180deg, #03091a, #04102a, #061634);
        }
        input::placeholder { color: rgba(255,255,255,.5); }
        a { color: #8fd0ff; text-decoration: none; }

        .card { width: 100%; max-width: 440px; animation: rise 420ms cubic-bezier(.22,1,.36,1) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

        .orb {
            margin: 0 auto 16px; width: 40px; height: 40px; border-radius: 50%;
            background: radial-gradient(circle at 34% 30%, #eaf6ff 0%, #7cc4f7 42%, #1a6fc4 78%, #0c3f7d 100%);
            box-shadow: 0 0 22px rgba(90,180,255,.55);
        }
        .heading { text-align: center; margin-bottom: 22px; }
        .heading h1 { margin: 0; font-size: clamp(22px,2.6vw,28px); font-weight: 700; color: #ffffff; letter-spacing: -.01em; }
        .heading h1 span { color: #43a4ff; }
        .heading p { margin: 8px 0 0; font-size: 13.5px; color: #c9d9ee; }
        .heading p strong { color: #ffffff; font-weight: 600; }

        form.panel {
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.26);
            padding: 26px;
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            background: linear-gradient(105deg, rgba(214,228,245,.2), rgba(150,180,215,.1));
            box-shadow: 0 18px 44px rgba(3,12,32,.34);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .alert { border-radius: 8px; padding: 11px 14px; font-size: 13px; line-height: 1.5; }
        .alert strong { color: #ffffff; }
        .alert-lock, .alert-danger { background: rgba(255,110,110,.16); border: 1px solid rgba(255,140,140,.45); color: #ffe1e1; }
        .alert-warn { background: rgba(255,184,77,.14); border: 1px solid rgba(255,196,110,.45); color: #ffe9c7; }
        .alert-success { background: rgba(0,187,228,.14); border: 1px solid rgba(0,187,228,.45); color: #d6f6ff; }

        .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #c9d9ee; }

        .domain-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(3,9,26,.3); }
        .domain-toggle label {
            height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 999px; cursor: pointer;
            font-size: 13px; font-weight: 600; color: #dce7f5;
            transition: background .2s, color .2s;
        }
        .domain-toggle input { position: absolute; opacity: 0; pointer-events: none; }
        .domain-toggle label:has(input:checked) { background: #ffffff; color: #123a63; }

        .field { display: flex; flex-direction: column; gap: 8px; }
        .field-input {
            height: 46px; border-radius: 10px; border: 1px solid rgba(255,255,255,.28);
            background: rgba(255,255,255,.08); padding: 0 16px; width: 100%;
            font-family: inherit; font-size: 15px; color: #ffffff; outline: none;
            transition: border-color .2s, background .2s;
        }
        .field-input:focus { border-color: #8fd0ff; background: rgba(255,255,255,.12); }
        .pw-wrap { position: relative; }
        .pw-wrap .field-input { padding-right: 64px; }
        .pw-toggle {
            position: absolute; right: 8px; top: 8px; height: 30px; padding: 0 10px;
            border: none; border-radius: 999px; background: rgba(255,255,255,.1);
            font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em;
            color: #dce7f5; cursor: pointer;
        }

        .submit-btn {
            margin-top: 4px; display: flex; align-items: center; justify-content: space-between;
            border: none; border-radius: 999px; background: #ffffff; padding: 6px;
            font-family: inherit; font-size: 14px; font-weight: 600; color: #0d2b52; cursor: pointer;
        }
        .submit-btn:disabled { opacity: .45; cursor: not-allowed; }
        .submit-btn span.label { padding-left: 22px; }
        .submit-btn span.icon {
            display: flex; width: 36px; height: 36px; border-radius: 50%;
            background: #0b63c5; color: #ffffff; align-items: center; justify-content: center;
        }

        .footer-note { margin: 18px 0 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: rgba(201,217,238,.75); }
    </style>
</head>
<body>

<div class="card">
    <div class="heading">
        <div class="orb"></div>
        <h1>Sign in to <span>CMC Global</span></h1>
        <p>Continue to <strong>CMS Admin</strong></p>
    </div>

    <form class="panel" method="post" th:action="@{/login}" id="login-form">
        <div th:if="${locked != null and locked}" class="alert alert-lock" role="alert">
            <strong>Account locked.</strong> Too many failed attempts. Try again in 10 minutes.
        </div>
        <div th:if="${attemptsLeft != null}" class="alert alert-warn" role="alert">
            <strong>Invalid credentials.</strong> <span th:text="${attemptsLeft}"></span> attempt(s) remaining before lockout.
        </div>
        <div th:if="${param.error != null and locked == null and attemptsLeft == null}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been signed out.
        </div>

        <div class="field">
            <span class="eyebrow">Account type</span>
            <div class="domain-toggle">
                <label>
                    <input type="radio" name="domain" value="INTERNAL" checked /> Internal staff
                </label>
                <label>
                    <input type="radio" name="domain" value="GUEST" /> Guest
                </label>
            </div>
        </div>

        <label class="field">
            <span class="eyebrow">Username</span>
            <input class="field-input" type="text" id="username" name="username"
                   placeholder="name.surname" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span class="eyebrow">Password</span>
            <div class="pw-wrap">
                <input class="field-input" type="password" id="password" name="password"
                       placeholder="••••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pw-toggle">SHOW</button>
            </div>
        </label>

        <button class="submit-btn" type="submit" th:disabled="${locked}">
            <span class="label" th:text="${locked} ? 'Access locked' : 'Sign in'"></span>
            <span class="icon">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </span>
        </button>
    </form>

    <p class="footer-note">Secure OAuth2 · PKCE flow · Session encrypted</p>
</div>

<script>
    document.getElementById('pw-toggle').addEventListener('click', function () {
        var pw = document.getElementById('password');
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        this.textContent = showing ? 'SHOW' : 'HIDE';
    });

    /* Domain persistence — same as before: remembers the last-picked account type per browser. */
    document.addEventListener('DOMContentLoaded', function () {
        var saved = localStorage.getItem('selectedDomain');
        if (saved) {
            var radio = document.querySelector('input[name="domain"][value="' + saved + '"]');
            if (radio) radio.checked = true;
        }
    });
    document.getElementById('login-form').addEventListener('submit', function () {
        var selected = document.querySelector('input[name="domain"]:checked');
        if (selected) localStorage.setItem('selectedDomain', selected.value);
    });
</script>

</body>
</html>
