<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/ams.svg" />
    <title th:text="${title} + ' · CMS Accounts'">Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/admin.css}">
    <script defer th:src="@{/assets/js/local-time.js}"></script>
</head>
<body>
<aside class="sider" th:fragment="sidebar(active)">
    <div class="sider-head">
        <img th:src="@{/assets/img/logo.svg}" alt="CMC Global">
        <span class="pill-brand">ACCOUNTS</span>
    </div>
    <nav class="nav" aria-label="Sections">
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'is-active'">Users</a>
        <a th:href="@{/admin/audit}" th:classappend="${active == 'audit'} ? 'is-active'">Audit log</a>
    </nav>
    <div class="sider-foot">
        <div>Signed in as<br><span class="me" th:text="${me}">admin</span></div>
        <div class="row">
            <a th:href="${cmsUrl}">Back to CMS</a>
            <form th:action="@{/logout}" method="post"><button type="submit" class="linklike">Sign out</button></form>
        </div>
    </div>
</aside>
</body>
</html>
