services:
  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    image: takypok/auth-service
    container_name: auth-service
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://auth-service:9000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: authentication
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka}
      LDAP_URL: ${LDAP_URL:-ldap://host.docker.internal:389}
      LDAP_BASE: ${LDAP_BASE:-dc=mycompany,dc=local}
      LDAP_USERNAME: ${LDAP_USERNAME:-cn=admin,dc=mycompany,dc=local}
      LDAP_PASSWORD: ${LDAP_PASSWORD:-admin_secret}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-ou=users}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-(cn={0})}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://alloy:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-http://alloy:4318/v1/metrics}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # discovery-service isn't defined in this file — this depends_on only resolves when
    # this file is passed to compose alongside discovery-service's own, e.g.:
    #   docker compose -f ../discovery-service/docker-compose.yml -f docker-compose.yml up -d
    # Running `docker compose up` from this directory alone fails validation.
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - takypok_default
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  takypok_default:
    external: true

