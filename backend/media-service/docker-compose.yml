services:
  media-service:
    build:
      context: ..
      dockerfile: media-service/Dockerfile
    image: takypok/media-service
    container_name: media-service
    labels:
      # Alloy skips docker-log collection for this container; it reads the log file instead
      logging.source: file
    ports:
      - "8082:8082"
    environment:
      LOG_DIR: /logs
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://auth-service:9000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: media
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Passed through only when set in .env (production: THIS VPS's private IP); unset = Docker network IP
      EUREKA_INSTANCE_IP_ADDRESS:
      EUREKA_URI: ${EUREKA_URI:-http://discovery-service:8761/eureka}
      JWK_URI: ${JWK_URI:-http://auth-service:9000/oauth2/jwks}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://alloy:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:-http://alloy:4318/v1/metrics}
    volumes:
      # Host dir the Alloy reads from (default: backend/logs); must match alloy's LOG_HOST_DIR
      - ${LOG_HOST_DIR:-../logs}:/logs
    networks:
      - takypok_default
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  takypok_default:
    external: true

