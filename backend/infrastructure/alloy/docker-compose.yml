# Only meaningful if this file is ever run standalone — normally it's merged into the
# root docker-compose.yaml's "takypok-app" project via its include list, which wins.
name: takypok-app

services:
  alloy:
    image: grafana/alloy:v1.4.3
    container_name: alloy
    # privileged + host mounts below are cAdvisor's documented requirements for
    # per-container metrics (prometheus.exporter.cadvisor in config.alloy). This only
    # works correctly on a native Linux Docker host — on Docker Desktop for Mac/Windows,
    # container storage is virtualized and cAdvisor can't resolve the overlayfs layer
    # metadata it needs (fails with "failed to identify the read-write layer ID"),
    # so per-container RAM/CPU/disk-IO metrics won't populate there. Host-level metrics
    # (prometheus.exporter.unix) and log shipping work fine on both.
    privileged: true
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    # Host networking: 12345 (UI), 4317 (OTLP gRPC) and 4318 (OTLP HTTP) listen on the machine itself.
    network_mode: host
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - ${LOG_HOST_DIR:-../../logs}:/var/log/takypok:ro   # service log files (default: backend/logs)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /:/host:ro
    environment:
      LOKI_URL: ${LOKI_URL:-http://127.0.0.1:3101/loki/api/v1/push}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:-http://127.0.0.1:9090/api/v1/write}
      LOG_PATH_GLOB: ${LOG_PATH_GLOB:-/var/log/takypok/*/*.log}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-127.0.0.1:4319}
      # Status dashboard probes; defaults reach a website / admin app running on the docker host
      PROBE_WEBSITE_URL: ${PROBE_WEBSITE_URL:-http://127.0.0.1:3000}
      PROBE_ADMIN_URL: ${PROBE_ADMIN_URL:-http://127.0.0.1:5173}
      PROBE_DATABASE_ADDR: ${PROBE_DATABASE_ADDR:-127.0.0.1:5432}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

volumes:
  alloy-data:
    name: alloy_data
    driver: local
