# Own project name so this stack isn't lumped into the same "takypok" project as
# everything else — started/stopped independently of the app services and other infra
# stacks. Host networking: Redis listens on the machine's own port 6379, so services
# reach it at 127.0.0.1 (same host) or this VPS's private IP. Firewall it to the private network.
name: takypok-redis

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"
    restart: unless-stopped
