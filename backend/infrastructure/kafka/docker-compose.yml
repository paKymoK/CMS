# Own project name so this stack isn't lumped into the same "takypok" project as
# everything else — started/stopped independently of the app services and other infra
# stacks. It still shares the "takypok_default" network (declared explicitly below,
# not just implied by a shared project name) so services can reach it by container DNS.
name: takypok-kafka

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka}:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Local single-broker dev instance carrying a handful of low-traffic topics — the default
      # -Xmx1G/-Xms1G is way more than needed and adds up on an 8GB machine running the rest of
      # this stack alongside it.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    restart: unless-stopped
    networks:
      - takypok_default

# Named explicitly (not external) so whichever of the independent infra stacks
# (postgres/kafka/redis) happens to start first creates it; the others just attach.
networks:
  takypok_default:
    name: takypok_default

volumes:
  kafka-data:
    name: kafka_data
    driver: local
