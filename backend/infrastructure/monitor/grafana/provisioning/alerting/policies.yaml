apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ['alertname', 'job', 'service', 'component']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical: re-notify every 30m until resolved. Warning falls through to the 4h default.
      - receiver: discord-alerts
        object_matchers:
          - ['severity', '=', 'critical']
        repeat_interval: 30m
