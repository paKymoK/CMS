apiVersion: 1

groups:
  - orgId: 1
    name: service-health
    folder: Service Alerts
    interval: 1m
    rules:
      - uid: svc-down
        title: Service down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} is down'
          description: '{{ $labels.job }} has not pushed metrics for {{ humanizeDuration $values.B.Value }} (a full day means it was never seen in the last 24h). Check the process, OTLP_EXPORT_ENABLED and Alloy.'
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'min by (job) (time() - max_over_time(timestamp(process_uptime_seconds{job=~".*-service"})[24h:30s])) or label_replace(vector(86400), "job", "discovery-service", "", "") or label_replace(vector(86400), "job", "auth-service", "", "") or label_replace(vector(86400), "job", "media-service", "", "") or label_replace(vector(86400), "job", "content-service", "", "") or label_replace(vector(86400), "job", "gateway-service", "", "")'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 120
              refId: C
      - uid: svc-5xx-ratio
        title: High 5xx error ratio
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }}: 5xx ratio above 5%'
          description: '{{ $labels.job }} is answering {{ humanizePercentage $values.B.Value }} of requests with 5xx (5m window, ignored below 0.05 req/s).'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (job) (rate(http_server_requests_seconds_count{job=~".*-service",status=~"5.."}[5m])) / sum by (job) (rate(http_server_requests_seconds_count{job=~".*-service"}[5m])) and sum by (job) (rate(http_server_requests_seconds_count{job=~".*-service"}[5m])) > 0.05'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
              refId: C
      - uid: svc-latency-p99
        title: High p99 latency
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }}: p99 latency above 2s'
          description: '{{ $labels.job }} p99 request latency is {{ printf "%.2f" $values.B.Value }}s over 5m.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.99, sum by (job, le) (rate(http_server_requests_seconds_bucket{job=~".*-service",uri!~"/actuator.*"}[5m])))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
              refId: C
      - uid: svc-heap-high
        title: JVM heap above 90%
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }}: heap above 90%'
          description: '{{ $labels.job }} heap usage is {{ humanizePercentage $values.B.Value }} of max for 10m.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (job) (jvm_memory_used_bytes{job=~".*-service",area="heap"}) / sum by (job) (jvm_memory_max_bytes{job=~".*-service",area="heap"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.9
              refId: C
      - uid: svc-gc-overhead
        title: High GC pause time
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }}: GC pausing over 20% of the time'
          description: '{{ $labels.job }} spends {{ humanizePercentage $values.B.Value }} of wall time in GC pauses.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (job) (rate(jvm_gc_pause_seconds_sum{job=~".*-service"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.2
              refId: C
      - uid: svc-db-pool-pending
        title: DB connection pool saturated
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }}: threads waiting for a DB connection'
          description: '{{ $labels.job }} has {{ printf "%.0f" $values.B.Value }} callers pending on the connection pool for 5m.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum by (job) (hikaricp_connections_pending{job=~".*-service"}) or sum by (job) (r2dbc_pool_pending_connections{job=~".*-service"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
      - uid: probe-down
        title: Website, admin or database down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.component }} is down'
          description: 'The {{ $labels.component }} probe has been failing (or has no data) for 1m. Check the {{ $labels.component }} and Alloy.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'max by (component) (probe_success{component=~"website|admin|database"}) or label_replace(vector(0), "component", "website", "", "") or label_replace(vector(0), "component", "admin", "", "") or label_replace(vector(0), "component", "database", "", "")'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
              refId: C

  - orgId: 1
    name: host-resources
    folder: Host Alerts
    interval: 1m
    rules:
      - uid: host-mem-low
        title: Host memory low
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Host memory under 10% available'
          description: 'Only {{ humanizePercentage $values.B.Value }} of host memory is available.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.1
              refId: C
      - uid: host-cpu-high
        title: Host CPU high
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Host CPU above 90%'
          description: 'Host CPU has been at {{ humanizePercentage $values.B.Value }} for 10m.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: '1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.9
              refId: C
      - uid: host-disk-low
        title: Host disk low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Host disk under 15% free'
          description: 'The fullest filesystem has {{ humanizePercentage $values.B.Value }} free.'
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'min(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.15
              refId: C

  - orgId: 1
    name: log-alerts
    folder: Log Alerts
    interval: 30s
    rules:
      - uid: service-error-rate
        title: Service ERROR logs spike
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }}: more than 5 ERROR logs in 5m'
          description: '{{ $labels.service }} logged {{ printf "%.0f" $values.B.Value }} ERROR lines in the last 5m. Check Loki: {level="ERROR", service="{{ $labels.service }}"}.'
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (service) (count_over_time({level="ERROR"}[5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
              refId: C
